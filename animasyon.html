<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karakter Laboratuvarı</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b2c;color:#f4e5c0;font:15px system-ui}header,main{padding:20px}a{color:#ffe0a0}main{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:20px}section,aside{background:#19283b;border:1px solid #45536a;border-radius:14px;padding:16px}button,select,input{font:inherit}button,select{background:#263950;color:white;border:1px solid #b59a61;border-radius:7px;padding:9px;margin:3px}label{display:block;margin:14px 0}input[type=range]{width:100%}canvas{max-width:100%;height:auto;display:block}#stage{margin:auto;background:repeating-linear-gradient(0deg,transparent 0 19px,#ffffff0c 19px 20px),#142c30}#frames{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}#frames button{padding:4px;text-align:center}#frames button.active{outline:2px solid gold}small{color:#c0cad7}@media(max-width:720px){main{grid-template-columns:1fr}}</style></head><body><header><a href="./gelistirme.html">← Yerel stüdyo</a><h1>Karakter ve Animasyon Laboratuvarı</h1><small>Gerçek oyun atlasları · Orijinal dosyalar salt okunur · Deneysel ayarlar</small></header><main><aside><label>Karakter <select id="char"><option value="erdem">Erdem</option><option value="ciko">Çiko</option></select></label><label>Hareket <select id="motion"></select></label><button id="play">Duraklat</button><button id="prev">◀ Kare</button><button id="next">Kare ▶</button><label>Hız <output id="speedOut">100%</output><input id="speed" type="range" min="10" max="200" value="100"></label><label>Ölçek <output id="scaleOut">100%</output><input id="scale" type="range" min="50" max="150" value="100"></label><label><input id="flip" type="checkbox"> Sola bak</label><label><input id="bounds" type="checkbox" checked> Çizim sınırı ve referans noktası</label><button id="reset">Varsayılanlar</button><button id="save">Deneme ayarlarını JSON indir</button><p id="status" role="status">Atlaslar yükleniyor...</p><small>Hız ve ölçek yalnızca bu laboratuvarda uygulanır. JSON çıktısı oyuna otomatik işlenmez. Çizim sınırı gerçek çarpışma kutusu değildir.</small></aside><section><canvas id="stage" width="640" height="440"></canvas><p id="info" aria-live="off"></p><div id="frames"></div></section></main><script src="./deneme-v36/erdem-v83-hd-atlas.js"></script><script src="./deneme-v36/chiko-v57-hd-atlas.js"></script><script>
"use strict";const $=id=>document.getElementById(id),ctx=$('stage').getContext('2d');const configs={erdem:{cols:4,w:260,h:405,dw:165,dh:257,anchor:394/405,src:window.ERDEM_V83_HD_ATLAS,modes:{idle:{name:'Bekleme',frames:[14],fps:1},walk:{name:'Yürüme',frames:[0,1,2,3,4,5,6,7],fps:8},jump:{name:'Zıplama pozları',frames:[8,9,10,11,12,13],fps:6},turn:{name:'Dönüş',frames:[14,15,16,17],fps:15.38}}},ciko:{cols:6,w:192,h:192,dw:104,dh:104,anchor:.5,src:window.CHIKO_V57_HD_ATLAS,modes:{idle:{name:'Yerinde uçuş',frames:[0,1,2,3,4,5,6,7],fps:12},fly:{name:'Uçuş',frames:[0,1,2,3,4,5,6,7],fps:15.2},climb:{name:'Yükselme',frames:[8,9,10,11,12,13],fps:18.8*.72},turn:{name:'Dönüş',frames:[14,15,16,17],fps:12.5}}}};for(const c of Object.values(configs)){c.img=new Image();c.img.src=c.src||''}let playing=true,index=0,elapsed=0,last=0;const cfg=()=>configs[$('char').value],mode=()=>cfg().modes[$('motion').value];function ready(c){return c.img.complete&&c.img.naturalWidth>=c.cols*c.w&&c.img.naturalHeight>=Math.ceil(18/c.cols)*c.h}function setPlay(p){playing=p;$('play').textContent=p?'Duraklat':'Oynat'}function changeChar(){let c=cfg();$('motion').replaceChildren(...Object.entries(c.modes).map(([k,m])=>new Option(m.name,k)));$('motion').value=$('char').value==='erdem'?'walk':'fly';changeMode()}function changeMode(){index=0;elapsed=0;buildFrames()}function buildFrames(){const c=cfg(),m=mode();$('frames').replaceChildren();m.frames.forEach((n,i)=>{let b=document.createElement('button'),v=document.createElement('canvas');v.width=66;v.height=80;b.append(v,document.createTextNode('Kare '+(n+1)));b.onclick=()=>{index=i;elapsed=0;setPlay(false)};$('frames').append(b);if(ready(c)){let g=v.getContext('2d'),s=Math.min(66/c.w,80/c.h);g.drawImage(c.img,n%c.cols*c.w,Math.floor(n/c.cols)*c.h,c.w,c.h,(66-c.w*s)/2,(80-c.h*s)/2,c.w*s,c.h*s)}})}for(const c of Object.values(configs)){c.img.addEventListener('load',()=>{if(c===cfg())buildFrames()});c.img.addEventListener('error',()=>{$('status').textContent='Atlas yüklenemedi.'})}function draw(t){let dt=Math.min(.1,(t-last)/1000||0);last=t;let c=cfg(),m=mode();if(playing){elapsed+=dt*m.fps*Number($('speed').value)/100;while(elapsed>=1){index=(index+1)%m.frames.length;elapsed--}}ctx.clearRect(0,0,640,440);let n=m.frames[index],s=Number($('scale').value)/100,w=c.dw*s,h=c.dh*s,x=320,y=$('char').value==='erdem'?400:220;ctx.strokeStyle='#e5ca8555';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(640,y);ctx.stroke();if(ready(c)){ctx.save();ctx.translate(x,y);ctx.scale($('flip').checked?-1:1,1);ctx.drawImage(c.img,n%c.cols*c.w,Math.floor(n/c.cols)*c.h,c.w,c.h,-w/2,-h*c.anchor,w,h);if($('bounds').checked){ctx.strokeStyle='#efcf7c';ctx.strokeRect(-w/2,-h*c.anchor,w,h);ctx.fillStyle='#ffcf65';ctx.fillRect(-3,-3,6,6)}ctx.restore();$('status').textContent='Orijinal atlas hazır'}else $('status').textContent='Atlas bekleniyor veya yüklenemedi';$('info').textContent=m.name+' · '+(index+1)+' / '+m.frames.length+' · Atlas karesi '+(n+1)+' / 18 · '+(m.fps*Number($('speed').value)/100).toFixed(1)+' kare/sn (ön izleme)';[...$('frames').children].forEach((b,i)=>b.classList.toggle('active',i===index));requestAnimationFrame(draw)}$('char').onchange=changeChar;$('motion').onchange=changeMode;$('play').onclick=()=>setPlay(!playing);function step(d){setPlay(false);index=(index+d+mode().frames.length)%mode().frames.length;elapsed=0}$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);for(const k of ['speed','scale'])$(k).oninput=()=>$(k+'Out').value=$(k).value+'%';$('reset').onclick=()=>{for(const k of ['speed','scale']){$(k).value=100;$(k).oninput()}$('flip').checked=false;index=0;elapsed=0;setPlay(true)};$('save').onclick=()=>{let data={character:$('char').value,motion:$('motion').value,frames:mode().frames,speedPercent:Number($('speed').value),scalePercent:Number($('scale').value),facing:$('flip').checked?-1:1,previewOnly:true};let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='animasyon-deneme.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};changeChar();requestAnimationFrame(draw);
</script></body></html>
