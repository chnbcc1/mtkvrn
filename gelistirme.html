<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matematik Evreni Stüdyo v6</title><style>
*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{display:flex;flex-direction:column;margin:0;background:#0e1727;color:#e8edf5;font:14px system-ui}header{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid #34445a;background:#172439}h1{font-size:19px;margin:0;color:#f1d092}small{color:#aab9cd}button,select,input{font:inherit}button,select{background:#21334a;color:#e8edf5;border:1px solid #495c75;border-radius:7px;padding:9px;cursor:pointer}button[aria-selected=true]{background:#745c30;color:#fff1cb;border-color:#d3ad68}button:disabled{opacity:.4;cursor:default}a{color:#f1d092}main{flex:1;min-height:0;display:grid;grid-template-columns:205px minmax(0,1fr);height:auto}nav{padding:12px;background:#142136;border-right:1px solid #34445a;overflow:auto}nav button{display:block;width:100%;text-align:left;margin:5px 0}nav h3{font-size:12px;color:#9eafc5;letter-spacing:1px;margin:20px 0 8px}#workspace{display:flex;flex-direction:column;min-width:0;min-height:0}#toolbar{padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #34445a}#viewport{flex:1;min-height:0;overflow:auto;padding:10px;text-align:center}iframe{display:block;border:0;background:#101b2c;width:100%;height:100%;margin:auto}iframe.game{border:1px solid #b59a61;border-radius:10px;flex:none}#status{padding:8px 14px;background:#172439;color:#afc4b4;border-top:1px solid #34445a}input[type=number]{width:65px;padding:6px;background:#101b2c;color:#fff;border:1px solid #495c75;border-radius:5px}#gameTools{display:flex;gap:5px;align-items:center;flex-wrap:wrap}#gameTools[hidden]{display:none}#viewport>div[hidden],#viewport>iframe[hidden]{display:none}@media(max-width:760px){main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);height:auto}nav{display:flex;gap:4px;overflow:auto}nav h3,nav p{display:none}nav button{white-space:nowrap;width:auto;margin:0}#viewport{padding:4px}}
</style></head><body><header><div><h1>MATEMATİK EVRENİ · STÜDYO v6</h1><small>Yerel çalışma alanı · phaser-test · ana oyun korunuyor</small></div></header><main><nav aria-label="Stüdyo modülleri"><h3>OYUN</h3><button data-tab="game" aria-selected="true">🎮 Gerçek oyun</button><button data-tab="forest" aria-selected="false">🌲 Orman bölümü</button><button data-tab="foresttest" aria-selected="false">🧪 Gerçek orman fizik testi</button><h3>DÜZENLEME</h3><button data-tab="animation" aria-selected="false">🎞 Animasyonlar</button><button data-tab="physics" aria-selected="false">⚙ Hareket ve fizik</button><h3>PROJE</h3><button data-tab="updates" aria-selected="false">↻ Sürüm merkezi</button><button data-tab="rules" aria-selected="false">📖 Proje anayasası</button><p><small>Dört fizik ayarı ayrı gerçek orman testine aktarılabilir. Otomatik test henüz bağlı değil. Laboratuvarlar deneyseldir.</small></p></nav><div id="workspace"><div id="toolbar"><strong id="tabName">Gerçek oyun</strong><div id="gameTools"><button data-size="390,844">iPhone dikey</button><button data-size="844,390">iPhone yatay</button><button data-size="360,800">Android</button><label>W <input id="w" type="number" min="240" max="1920" value="390"></label><label>H <input id="h" type="number" min="240" max="1920" value="844"></label></div><button id="fit">Görünüm: Sığdır</button><button id="reload">Yenile</button><button id="external">Ayrı sekmede aç</button></div><div id="viewport"></div><div id="status" role="status">Oyun ön izlemesi · Yerel test</div></div></main><script>
"use strict";const $=id=>document.getElementById(id);const tabs={game:{name:'Gerçek oyun',url:'./deneme-v36/index.html',game:true},forest:{name:'Orman bölümü',url:'./deneme-v36/forest-v113-full.html',game:true},foresttest:{name:'Gerçek orman fizik testi',url:'./deneme-v36/forest-v113-full.html?studioPhysics=1',game:true},animation:{name:'Animasyon laboratuvarı',url:'./animasyon.html'},physics:{name:'Hareket ve fizik laboratuvarı',url:'./hareket.html'},updates:{name:'Sürüm merkezi',url:'./surum.html'},rules:{name:'Proje anayasası',url:'./deneme-v36/docs/PROJE_ANAYASASI.md?raw'}};let active='game';const frames=new Map(),holders=new Map();let fit=true;function size(){const f=frames.get(active);if(!f||!tabs[active].game)return;const w=Math.max(240,Math.min(1920,Number($('w').value)||390)),h=Math.max(240,Math.min(1920,Number($('h').value)||844)),v=$('viewport'),z=fit?Math.max(.1,Math.min(1,(v.clientWidth-24)/w,(v.clientHeight-24)/h)):1;f.style.width=w+'px';f.style.height=h+'px';f.style.transformOrigin='top left';f.style.transform='scale('+z+')';const box=holders.get(active);box.style.width=w*z+'px';box.style.height=h*z+'px'}function openTab(k){active=k;const t=tabs[k];for(const [id,f] of holders)f.hidden=id!==k;if(!frames.has(k)){const f=document.createElement('iframe');f.title=t.name;f.src=t.url;f.className=t.game?'game':'';const box=document.createElement('div');box.style.cssText=t.game?'position:relative;overflow:hidden;margin:auto':'width:100%;height:100%';box.append(f);$('viewport').append(box);holders.set(k,box);frames.set(k,f)}$('tabName').textContent=t.name;$('gameTools').hidden=!t.game;$('fit').hidden=!t.game;$('status').textContent=t.game?'Gerçek oyun ön izlemesi · Yerel kayıtlar canlı yayından ayrıdır':'Deneysel çalışma alanı · Ana oyun dosyaları değişmez';document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===k)));size()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openTab(b.dataset.tab));document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{[$('w').value,$('h').value]=b.dataset.size.split(',');size()});$('w').oninput=$('h').oninput=size;$('reload').onclick=()=>{if(confirm('Bu çalışma alanı yeniden yüklenir. Kaydedilmemiş deneme ayarları kaybolabilir. Devam?')){const f=frames.get(active);f.contentWindow.location.reload()}};$('external').onclick=()=>window.open(tabs[active].url,'_blank','noopener');$('fit').onclick=()=>{fit=!fit;$('fit').textContent=fit?'Görünüm: Sığdır':'Görünüm: %100';size()};window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frames.get('physics')?.contentWindow||e.data?.type!=='mtk-physics-applied')return;const f=frames.get('foresttest');if(f)f.src=tabs.foresttest.url;openTab('foresttest')});new ResizeObserver(size).observe($('viewport'));openTab('game');
</script></body></html>
