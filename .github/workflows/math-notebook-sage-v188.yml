name: Sage Notebook Watermark v188 Regression
on:
  push:
    branches: [main]
    paths:
      - "deneme-v36/assets/math-notebook-forest-v186.css"
      - "deneme-v36/assets/math-notebook-v187.js"
      - "deneme-v36/tests/math-notebook-sage-v188.test.cjs"
      - ".github/workflows/math-notebook-sage-v188.yml"
  pull_request:
    paths:
      - "deneme-v36/assets/math-notebook-forest-v186.css"
      - "deneme-v36/assets/math-notebook-v187.js"
      - "deneme-v36/tests/math-notebook-sage-v188.test.cjs"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node deneme-v36/tests/math-notebook-sage-v188.test.cjs
