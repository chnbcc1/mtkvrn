name: Forest Notebook v191 Paper and Controls Regression
on:
  push:
    branches: [main]
    paths:
      - "deneme-v36/assets/math-notebook-v187.js"
      - "deneme-v36/assets/math-notebook-ui-v191.css"
      - "deneme-v36/assets/erdem-ivy-paper-v191.webp"
      - "deneme-v36/forest-v70-quiz.html"
      - "deneme-v36/tests/math-notebook-v191.test.cjs"
      - ".github/workflows/math-notebook-v191.yml"
  pull_request:
    paths:
      - "deneme-v36/assets/math-notebook-v187.js"
      - "deneme-v36/assets/math-notebook-ui-v191.css"
      - "deneme-v36/tests/math-notebook-v191.test.cjs"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node deneme-v36/tests/math-notebook-v191.test.cjs
