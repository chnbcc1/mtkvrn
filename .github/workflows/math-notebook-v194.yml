name: Original Ivy Retina v194 Regression
on:
  push:
    branches: [main]
    paths:
      - "deneme-v36/assets/ivy-original-retina-v194.webp"
      - "deneme-v36/assets/math-notebook-retina-v194.css"
      - "deneme-v36/forest-v70-quiz.html"
      - "deneme-v36/tests/math-notebook-v194.test.cjs"
      - ".github/workflows/math-notebook-v194.yml"
  pull_request:
    paths:
      - "deneme-v36/assets/ivy-original-retina-v194.webp"
      - "deneme-v36/assets/math-notebook-retina-v194.css"
      - "deneme-v36/tests/math-notebook-v194.test.cjs"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node deneme-v36/tests/math-notebook-v194.test.cjs
