name: Research Visuals v150 Regression
on:
  push:
    paths:
      - "deneme-v36/assets/meaningful-research-v150.js"
      - "deneme-v36/assets/approved-quiz-ui-v145.js"
      - "deneme-v36/forest-v70-quiz.html"
      - "deneme-v36/forest-questions-v147.json"
      - "deneme-v36/tests/research-meaningful-v149.test.cjs"
      - ".github/workflows/research-visuals-v149.yml"
  pull_request:
    paths:
      - "deneme-v36/assets/meaningful-research-v150.js"
      - "deneme-v36/assets/approved-quiz-ui-v145.js"
      - "deneme-v36/forest-v70-quiz.html"
      - "deneme-v36/tests/research-meaningful-v149.test.cjs"
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify readable growth and energy controls do not cover illustration
        run: node deneme-v36/tests/research-meaningful-v149.test.cjs
