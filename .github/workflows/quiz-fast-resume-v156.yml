name: Fast Quiz and Resume v156 Regression
on:
  push:
    paths:
      - "deneme-v36/forest-v113-full.html"
      - "deneme-v36/forest-v70-quiz.html"
      - "deneme-v36/forest-questions-v147.json"
      - "deneme-v36/tests/quiz-fast-resume-v156.test.cjs"
      - ".github/workflows/quiz-fast-resume-v156.yml"
  pull_request:
    paths:
      - "deneme-v36/forest-v113-full.html"
      - "deneme-v36/forest-v70-quiz.html"
      - "deneme-v36/tests/quiz-fast-resume-v156.test.cjs"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify instant prewarm and same question after returning to the path
        run: node deneme-v36/tests/quiz-fast-resume-v156.test.cjs
