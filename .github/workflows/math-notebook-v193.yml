name: Original Ivy and iPhone Notch v193 Regression
on:
  push:
    branches: [main]
    paths:
      - "deneme-v36/assets/math-notebook-iphone-v193.css"
      - "deneme-v36/forest-v70-quiz.html"
      - "deneme-v36/tests/math-notebook-v193.test.cjs"
      - ".github/workflows/math-notebook-v193.yml"
  pull_request:
    paths:
      - "deneme-v36/assets/math-notebook-iphone-v193.css"
      - "deneme-v36/tests/math-notebook-v193.test.cjs"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node deneme-v36/tests/math-notebook-v193.test.cjs
