name: Restore full Erdem atlas as lossless mobile WebP
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-forest-sprite-webp.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact-preserving image decoder/encoder
        run: python -m pip install "Pillow>=11.0" pillow-avif-plugin
      - name: Convert existing approved atlas to lossless WebP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import pillow_avif
          source=Path("deneme-v36/assets/erdem-v83-hd-atlas-v182.avif")
          output=Path("deneme-v36/assets/erdem-v83-hd-atlas-v183.webp")
          with Image.open(source) as image:
              image.load()
              assert image.size == (1040,2025), f"Unexpected original size: {image.size}"
              rgba=image.convert("RGBA")
              rgba.save(output, "WEBP", lossless=True, method=6, exact=True)
          with Image.open(output) as rebuilt:
              assert rebuilt.size == (1040,2025)
              assert rebuilt.convert("RGBA").tobytes() == rgba.tobytes(), "Decoded pixels changed"
          print(f"Lossless original sprite atlas: {output} ({output.stat().st_size} bytes)")
          PY
      - name: Commit original-color, complete sprite atlas
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deneme-v36/assets/erdem-v83-hd-atlas-v183.webp
          git diff --cached --quiet || git commit -m "asset(v183): publish lossless WebP of approved Erdem 18-pose atlas"
          git push origin HEAD:main
