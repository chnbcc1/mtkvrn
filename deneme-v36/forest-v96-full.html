<body>
<canvas id="scene" aria-label="Erdem ve Çiko ile oynanabilir orman patikası"></canvas><div class="tint"></div>
<div class="hud hud-v75" aria-label="Orman Patikası ilerleme ve oyun menüsü">
 <div class="hudChapter"><b>🌲 ORMAN PATİKASI</b><small id="progress">0/21 engel · ORTA</small></div>
 <div class="trackShell" role="progressbar" aria-label="Tamamlanan matematik engelleri" aria-valuemin="0" aria-valuemax="21" aria-valuenow="0"><span id="progressFill"></span></div>
 <div class="hudRight"><button class="iconBtn" id="journal" aria-label="Bölüm notlarını göster">📜</button><button class="iconBtn" id="home" aria-label="Macera haritasını aç">🗺️</button></div>
</div>

 <button class="ctrl" id="examine" aria-label="Engeli incele" hidden>🔎 İNCELE</button><button class="ctrl" id="jump" aria-label="Zıpla">ZIPLA ↑</button>
</div>

 </div>
</section>

 </div>

<script>
'use strict';
const SAVE_KEY='mathverse-v40-investigation';
const W=49580,H=941,GROUND=760,RAVINE_LEFT=19298,RAVINE_RIGHT=19513,BRIDGE_X=19233,GATE_X=49060;
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d',{alpha:false});
const $=s=>document.querySelector(s);
const chiko=new Image(),forestPhoto=new Image();
forestPhoto.src=window.FOREST_HD_V67||'./forest-v66-hd.svg?v=66';
// Erdem sprite atlas is decoded once by erdem-animation-v81.js.
if(window.CHIKO_V57_HD_ATLAS)chiko.src=window.CHIKO_V57_HD_ATLAS;
let backing={},approved=false,solved=false,reachedGate=false,resumed=false,bridgeProgress=0,bridgeBuildStart=0,difficulty='orta',heroX=360,heroY=GROUND,vy=0,travel=0,face=1,requested=0,activePointers=new Map(),camera=0,camReady=false,scale=1,vw=innerWidth,vh=innerHeight,dpr=1,last=0,clock=0,flyingX=365,flyingY=420,flyingFace=1,modalOpen=false,started=false,saveLastX=360,saveTimer=0,nearMarker=null,seenMarker=false;
try{
 backing=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')||{};
 approved=Boolean(backing.complete&&backing.visitedStudy);
 const stage=backing.chapter2||{};
 resumed=stage.stage==='forest-path';
 solved=Boolean(stage.puzzleSolved);
 bridgeProgress=solved?1:0;
 reachedGate=Boolean(stage.reachedGate);
 difficulty=['kolay','orta','zor'].includes(stage.difficulty)?stage.difficulty:'orta';
 heroX=Math.min(solved?GATE_X+10:BRIDGE_X,Math.max(310,Number(stage.x)||360));
 if(new URLSearchParams(location.search).get('focus')==='gate'&&reachedGate)heroX=GATE_X-105;
}catch(e){backing={};approved=false;}
const QUESTIONS={
 kolay:{
  text:'Kırık köprünün açıklığını kapatmak için x metre uzunluğunda iki eş tahta ve 1 metrelik sabit destek kullanılacak. Toplam uzunluk 6 metre olduğuna göre bir tahta kaç metre olmalı?',
  relation:'2x + 1 = 6',options:['2 metre','2,5 metre','3 metre','3,5 metre'],correct:1,
  hint:'İki tahtanın toplamı 6 − 1 = 5 metredir. 2x = 5 eşitliğini çöz.',
  why:'2x + 1 = 6 ⇒ 2x = 5 ⇒ x = 2,5 metre.'
 },
 orta:{
  text:'Köprüye x metre uzunluğunda üç eş tahta ve toplam 0,6 metrelik sabit destek yerleştirilecek. Geçiş 7,8 metre olmalı. Her tahta kaç metre uzunluğunda olmalı?',
  relation:'3x + 0,6 = 7,8',options:['2,2 metre','2,4 metre','2,6 metre','3 metre'],correct:1,
  hint:'Önce 7,8 − 0,6 işlemini yap. Kalan uzunluk üç eş tahtaya bölünüyor.',
  why:'3x + 0,6 = 7,8 ⇒ 3x = 7,2 ⇒ x = 2,4 metre.'
 },
 zor:{
  text:'Her tahta 1,5 metre güvenli geçiş sağlar. Başlangıç platformu 0,8 metredir. En az 6,5 metrelik güvenli yol için kaç tam tahta gerekir?',
  relation:'1,5n + 0,8 ≥ 6,5',options:['3 tahta','4 tahta','5 tahta','6 tahta'],correct:1,
  hint:'1,5n ≥ 5,7. Her iki tarafı 1,5’e böl, sonucu tam tahta sayısına yuvarla.',
  why:'1,5n + 0,8 ≥ 6,5 ⇒ n ≥ 3,8. En az 4 tam tahta gerekir.'
 }
};
function save(force=false){
 if(!approved)return;
 if(!force&&Math.abs(saveLastX-heroX)<35&&saveTimer<2)return;
 saveLastX=heroX;saveTimer=0;
 try{
  const latest=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')||{};
  latest.chapter2EntrySeen=true;
  latest.activeScene='forest-path';
  latest.chapter2={...(latest.chapter2||{}),stage:'forest-path',x:Math.round(heroX),difficulty,puzzleSolved:solved,reachedGate};
  localStorage.setItem(SAVE_KEY,JSON.stringify(latest));
 }catch(e){}
}
function resize(){vw=innerWidth;vh=innerHeight;dpr=Math.min(devicePixelRatio||1,3);scale=Math.max(vh/H,vw/1450);canvas.width=Math.round(vw*dpr);canvas.height=Math.round(vh*dpr);canvas.style.width=vw+'px';canvas.style.height=vh+'px';camReady=false}
addEventListener('resize',resize);resize();
function openModal(title,content,eyebrow='BÖLÜM 2'){modalOpen=true;requested=0;activePointers.clear();updatePress();$('#modalTitle').textContent=title;$('#modalContent').innerHTML=content;$('#eyebrow').textContent=eyebrow;$('#modalActions').replaceChildren();$('#feedback').textContent='';$('#modal').hidden=false}
function closeModal(){modalOpen=false;$('#modal').hidden=true;$('#modalActions').replaceChildren();$('#feedback').textContent='';last=0}
function action(label,fn,variant='primary'){const b=document.createElement('button');b.type='button';b.className=variant;b.textContent=label;b.onclick=fn;$('#modalActions').appendChild(b);return b}
function story(){
 openModal('Orman Patikası','<p>Erdem haritayı çantasına yerleştirdi. Çiko, tepeye uzanan patikanın üzerinde uçuyordu.</p><div class="thought">💭 <b>Erdem:</b> “Eski gözlemevine giden yol bu olmalı.”</div><p>Yürüyerek ilerle, gerekirse zıpla. Yol üzerinde karşılaşacağın sorunu ölçerek çöz.</p>');
 action('Patikaya çık ▶',()=>{started=true;closeModal();save(true)});
}
function home(){save(true);location.assign('./map-v96.html?from=forest')}
function journal(){
 const title=reachedGate?'Gözlemevi kapısı':solved?'Köprü tamamlandı':'Orman patikası';
 const note=reachedGate?'Erdem ve Çiko gözlemevinin girişine ulaştı.':solved?'Köprüyü ölçerek geçebilecekleri uzunluğu buldular.':'Erdem ve Çiko dere üzerindeki köprüyü incelemeye gidiyor.';
 openModal('Erdem’in yol notları','<p><strong>'+title+'</strong></p><p>'+note+'</p><p>Köprü görevi: '+(solved?'Tamamlandı':'Henüz çözülmedi')+'</p>');
 action('Yola dön',closeModal);
 action('🗺️ Macera haritasına bak',home,'secondary');
 if(reachedGate)action('Gözlemevi kapısını incele',()=>{closeModal();reachGate()},'secondary');
}
function puzzle(showChoice=true){

   ctx.strokeStyle="#ead7b4";ctx.lineWidth=4;ctx.strokeRect(-61,-100,122,95);
   ctx.fillStyle="#fff1cd";ctx.textAlign="center";ctx.font="bold 20px system-ui";ctx.fillText("↔",0,-69);
  }

  if(idx===14){ // Special exponents and radicals matching gate.
    ctx.fillStyle="#1d484c";roundRect(-68,-164,136,110,14,"#16565b");
    ctx.strokeStyle="#aadccf";ctx.lineWidth=4;ctx.strokeRect(-66,-161,132,105);
    ctx.fillStyle="#e9d8af";ctx.font="bold 25px Georgia";ctx.fillText("²↔√", -27,-101);
  }
  if(idx===20){
    ctx.strokeStyle="#efc879";ctx.lineWidth=9;
    for(let j=-1;j<=1;j++){ctx.beginPath();ctx.arc(j*30,-112,18,0,Math.PI*2);ctx.stroke()}
  }
  if(unlocked){ctx.strokeStyle="#d1f4ce";ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-18,-88);ctx.lineTo(-5,-72);ctx.lineTo(22,-108);ctx.stroke();}
  ctx.globalAlpha=1;
  roundRect(-75,-198,150,34,8,"#163e42dd");ctx.strokeStyle="#ddc38a";ctx.lineWidth=1;ctx.strokeRect(-73,-197,146,32);
  ctx.fillStyle="#fff4d5";ctx.textAlign="center";ctx.font="bold 15px system-ui";
  ctx.fillText((idx+1)+"/21 · "+g.icon,0,-177);
  if(!unlocked){ctx.shadowColor=w;ctx.shadowBlur=14;ctx.fillStyle=w;ctx.beginPath();ctx.arc(0,-126,5+Math.sin(clock*2)*1.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
 });
}
const baseBackground=background;
background=function(){baseBackground();
 // Scenery and mathematics gates are behind the player. Road obstacles
 // receive their own depth-aware pass after the scenery is painted.
 drawBridgeDetailed();
 for(const g of GATES)drawMain(g);
};

/* Premium hand-painted object atlas. Each cell holds a separate forest mechanism. */
const propAtlas=new Image();
if(window.FOREST_PROPS_V69)propAtlas.src=window.FOREST_PROPS_V69;
const propIndex={F01:0,F02:1,F03:2,F04:3,F05:4,F06:5,F07:6,F09:8,F10:9,F11:10,F12:11,F13:6,F14:8,F21:3,F15:3,F16:6,F17:4,F18:2,F19:9,F20:3};
const originalDrawMain=drawMain;
drawMain=function(g){
 if(g.id==="F08")return;
 if(!propAtlas.complete||propAtlas.naturalWidth<1200){originalDrawMain(g);return}
 let index=propIndex[g.id],srcX=(index%4)*362,srcY=Math.floor(index/4)*362;
 const done=SOLVED.has(g.id);
 worldObject(g.x,GROUND,()=>{
  const w=done?282:302,h=done?258:290;
  ctx.save();ctx.globalAlpha=done?.58:1;
  // Soft contact shadow anchors the high-detail sprite to the dirt path.
  ctx.fillStyle="#12241f55";ctx.beginPath();ctx.ellipse(0,1,105,12,0,0,Math.PI*2);ctx.fill();
  if(index!==undefined)ctx.drawImage(propAtlas,srcX,srcY,362,362,-w/2,-h,w,h);
  ctx.restore();
  if(done){
   ctx.fillStyle="#d5f5c8";ctx.strokeStyle="#426d4b";ctx.lineWidth=4;
   ctx.beginPath();ctx.arc(93,-212,16,0,Math.PI*2);ctx.fill();ctx.stroke();
   ctx.strokeStyle="#2c8054";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(84,-212);ctx.lineTo(91,-204);ctx.lineTo(105,-220);ctx.stroke();
  }else{
   const glow=(Math.sin(clock*2)+1)*.5;
   ctx.fillStyle="#fff1aa";ctx.shadowColor="#c4fae1";ctx.shadowBlur=10+10*glow;
   ctx.beginPath();ctx.arc(0,-210,5+2*glow,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  }
 });
};
const originalDetailedBridge=drawBridgeDetailed;
drawBridgeDetailed=function(){
 originalDetailedBridge();
 if(SOLVED.has("F08")||!propAtlas.complete||propAtlas.naturalWidth<1200)return;
 worldObject(RAVINE_LEFT,GROUND,()=>{
  ctx.drawImage(propAtlas,3*362,1*362,362,362,-46,-279,(RAVINE_RIGHT-RAVINE_LEFT)+98,278);
 });
};
// v86: removed repeating seven-ellipse neon-green grass stamps. The HD forest
// already has realistic grass, shrubs, and path-edge details in its photo.

/* v71: foreground obstacles. Paint dimensions match HAZARD_GEOMETRY and the jump collider. */
function forestPoly(points,fill,stroke="#28362d",strokeWidth=3){
 ctx.beginPath();ctx.moveTo(points[0],points[1]);
 for(let i=2;i<points.length;i+=2)ctx.lineTo(points[i],points[i+1]);
 ctx.closePath();ctx.fillStyle=fill;ctx.fill();
 ctx.lineWidth=strokeWidth;ctx.strokeStyle=stroke;ctx.stroke();
}
function forestMoss(x,y,w){
 ctx.fillStyle="#6f9a4b";for(let i=0;i<7;i++){
  ctx.beginPath();ctx.ellipse(x+i*w/7,y+(i%3)*1.3,7,3,.25,0,Math.PI*2);ctx.fill()
 }
}
function paintMiniObstacle(h){
 const w=h.w,high=h.height;
 ctx.save();
 ctx.fillStyle="#1127207a";ctx.beginPath();ctx.ellipse(w/2,3,w*.69,12,0,0,Math.PI*2);ctx.fill();
 // Small gold directional cue is part of the road, not a text overlay.
 ctx.strokeStyle="#d9b56e";ctx.lineWidth=4;ctx.lineCap="round";
 ctx.beginPath();ctx.moveTo(-35,-5);ctx.lineTo(-35,-31);ctx.lineTo(-43,-23);ctx.moveTo(-35,-31);ctx.lineTo(-27,-23);ctx.stroke();
 if(h.type==="rock"){
  for(const [i,rock] of [{x:0,w:w*.43,h:61},{x:w*.28,w:w*.48,h:high},{x:w*.64,w:w*.36,h:58}].entries()){
   const g=ctx.createLinearGradient(rock.x,-rock.h,rock.x+rock.w,0);
   g.addColorStop(0,i===1?"#ccd6b8":"#b4c2ad");g.addColorStop(.48,"#778d82");g.addColorStop(1,"#354c47");
   forestPoly([rock.x,0,rock.x+2,-rock.h*.48,rock.x+rock.w*.35,-rock.h,rock.x+rock.w*.8,-rock.h*.83,rock.x+rock.w,-rock.h*.39,rock.x+rock.w,0],g,"#304238",3);
   ctx.strokeStyle="#d9dfbd";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(rock.x+5,-rock.h*.53);ctx.lineTo(rock.x+rock.w*.38,-rock.h+5);ctx.stroke();
   forestMoss(rock.x,-rock.h*.72,rock.w*.75);
  }
 }else if(h.type==="log"){
  const g=ctx.createLinearGradient(0,-high,0,0);
  g.addColorStop(0,"#b58a58");g.addColorStop(.4,"#825e38");g.addColorStop(1,"#493527");
  ctx.fillStyle=g;ctx.strokeStyle="#392b23";ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(5,0);ctx.bezierCurveTo(-2,-35,7,-high,22,-high+5);
  ctx.lineTo(w-9,-high+6);ctx.bezierCurveTo(w+7,-high+4,w+8,-15,w,0);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle="#cda879";ctx.strokeStyle="#67503b";ctx.lineWidth=3;
  ctx.beginPath();ctx.ellipse(w-10,-high*.5,17,high*.41,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  for(let i=1;i<4;i++){ctx.beginPath();ctx.ellipse(w-10,-high*.5,15-i*3,high*.35-i*5,0,0,Math.PI*2);ctx.strokeStyle="#946a4d";ctx.lineWidth=1.7;ctx.stroke()}
  for(let i=0;i<7;i++){const y=-12-i*10;ctx.strokeStyle=i%2?"#563d2d":"#d1a679";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(10,y);ctx.bezierCurveTo(w*.32,y-7,w*.5,y+7,w-23,y);ctx.stroke()}
  forestMoss(10,-high+9,w*.58);
  ctx.lineWidth=7;ctx.strokeStyle="#574130";ctx.beginPath();ctx.moveTo(w*.42,-high+8);ctx.lineTo(w*.33,-high-14);ctx.stroke();
 }else if(h.type==="root"){
  for(let i=0;i<3;i++){
   const x=i*33+8;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x,0);
   ctx.bezierCurveTo(x-9,-high*.35,x+4,-high*.9,x+28,-high*.82);
   ctx.bezierCurveTo(x+39,-high*.52,x+20,-high*.15,x+35,0);
   ctx.strokeStyle="#34291f";ctx.lineWidth=20;ctx.stroke();
   ctx.strokeStyle="#8e6644";ctx.lineWidth=14;ctx.stroke();
   ctx.strokeStyle="#cba072";ctx.lineWidth=3;ctx.stroke();
  }
  forestMoss(11,-high*.79,w*.77);
 }else if(h.type==="mushroom"){
  for(const m of [{x:w*.48,scale:1},{x:w*.14,scale:.64},{x:w*.82,scale:.7}]){
   const hh=high*m.scale,xx=m.x,k=m.scale;
   forestPoly([xx-10*k,0,xx-7*k,-hh*.77,xx+7*k,-hh*.77,xx+11*k,0],"#efd4a4","#ac804f",2);
   const g=ctx.createLinearGradient(0,-hh,0,-hh*.55);
   g.addColorStop(0,"#f47957");g.addColorStop(.55,"#bd3d33");g.addColorStop(1,"#842d2b");
   ctx.beginPath();ctx.moveTo(xx-25*k,-hh*.75);ctx.bezierCurveTo(xx-22*k,-hh*1.17,xx+23*k,-hh*1.15,xx+25*k,-hh*.75);
   ctx.quadraticCurveTo(xx,-hh*.56,xx-25*k,-hh*.75);ctx.closePath();
   ctx.fillStyle=g;ctx.strokeStyle="#6d2a28";ctx.lineWidth=3;ctx.fill();ctx.stroke();
   ctx.fillStyle="#fff3d6";for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(xx+(i-1.5)*8*k,-hh*.86-(i%2)*6*k,3*k,2.5*k,0,0,Math.PI*2);ctx.fill()}
  }
  forestMoss(0,-4,w);
 }else if(h.type==="gap"){
  const g=ctx.createLinearGradient(0,-12,0,105);
  g.addColorStop(0,"#191d1e");g.addColorStop(.48,"#142c34");g.addColorStop(1,"#266479");
  forestPoly([-5,-12,w+5,-12,w+8,12,w+2,96,-8,96,-8,12],g,"#362c21",5);
  ctx.strokeStyle="#e6c086";ctx.lineWidth=5;
  for(const x of [-6,w+5]){ctx.beginPath();ctx.moveTo(x,-15);ctx.lineTo(x,14);ctx.stroke()}
  ctx.strokeStyle="#74a6a5";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(4,72);ctx.quadraticCurveTo(w*.52,65,w-5,76);ctx.stroke();
  for(let i=0;i<7;i++){const x=i*w/7+5;ctx.strokeStyle="#ae926c";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,-12);ctx.lineTo(x+6,-20-i%3*3);ctx.stroke()}
 }
 ctx.restore();
}
// v89: draw ONE original high-resolution 2.5D portrait cutout per hazard.
// No 90 degree rotation and no 60px-wide image cells. This is deliberately
// not sprite scaling by movement or modification to Erdem animation.
const obstacleArt=window.MTK_V96_3D_OBSTACLES;
const OBSTACLE_CLEARANCE=Object.freeze({
 rock:59,log:56,root:62,mushroom:65,gap:29
});
function obstacleGeometry(h){
 const lane=FOREST_PHOTO_READY()?PHOTO_PATH_LANE:PATH_LANE;
 const roadDepth=lane.near-lane.far;
 // v96: top and bottom of the premium cutout are precisely aligned with the
 // photographed road edges; no portion extends into roadside grass.
 const drawHeight=roadDepth;
 const spriteAspect=obstacleArt.frameWidth/obstacleArt.frameHeight;
 const drawWidth=drawHeight*spriteAspect;
 const dx=(h.w-drawWidth)/2; // Keep every obstacle's original lane-center X.
 const dy=lane.far-h.laneY;
 return {
  dx,dy,dw:drawWidth,dh:drawHeight,
  top:lane.far,bottom:lane.near,
  left:h.x+dx,right:h.x+dx+drawWidth,
  clearance:OBSTACLE_CLEARANCE[h.type]
 };
}
drawMini=function(h){
 const m=obstacleGeometry(h),sprite=obstacleArt;
 worldObject(h.x,h.laneY,()=>{
  ctx.save();
  // Only solid objects cast a narrow contact shadow. A gap is cut into the
  // road itself and must not float above it.
  if(h.type!=="gap"){
   ctx.fillStyle="rgba(18,30,16,.23)";
   ctx.beginPath();
   ctx.ellipse(m.dx+m.dw/2,m.dy+m.dh-2,m.dw*.43,4.5,0,0,Math.PI*2);
   ctx.fill();
  }
  const index=sprite?.frameIndex?.(h.type)??-1;
  if(index>=0&&sprite.ready){
   ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
   ctx.drawImage(sprite.image,index*sprite.frameWidth,0,
    sprite.frameWidth,sprite.frameHeight,m.dx,m.dy,m.dw,m.dh);
  }else{
   ctx.fillStyle=h.type==="gap"?"rgba(29,32,29,.44)":"rgba(75,61,39,.27)";
   ctx.fillRect(m.dx,m.dy,m.dw,m.dh);
  }
  ctx.restore();
 });
};
// The road's near lip is in front of Erdem's grounded boots, while his
// airborne jump remains fully visible over every obstacle.
function drawObstacleNearRims(){
 if(heroY<GROUND-2||!obstacleArt?.ready)return;
 const sprite=obstacleArt;
 for(const h of HAZARDS){
  const m=obstacleGeometry(h);
  if(heroX<m.left-72||heroX>m.right+72)continue;
  const index=sprite.frameIndex(h.type);
  if(index<0)continue;
  worldObject(h.x,h.laneY,()=>{
   ctx.save();
   const frontY=GROUND+groundOffset-8-h.laneY;
   ctx.beginPath();
   ctx.rect(m.dx-1,frontY,m.dw+2,m.dh);
   ctx.clip();
   ctx.drawImage(sprite.image,index*sprite.frameWidth,0,
    sprite.frameWidth,sprite.frameHeight,m.dx,m.dy,m.dw,m.dh);
   ctx.restore();
  });
 }
}

// The photo-realistic forest background remains unmodified; no grass stamps.

render=function(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
 const maxCam=Math.max(0,W-vw/scale),desired=Math.max(0,Math.min(maxCam,heroX-vw/scale*.43));
 if(!camReady){camera=desired;camReady=true}else camera+=(desired-camera)*.13;
 background();
 for(const h of HAZARDS)drawMini(h);
 const a=available();if(a){const mp=campaignMarker(a);marker(mp.x,mp.y)}
 const ahead=Math.cos(clock*.9)>0;
 if(!ahead)birdSprite();
 const air=Math.max(0,GROUND-heroY),shadowScale=Math.max(.65,1-air/420);
 ctx.fillStyle="rgba(12,35,25,"+Math.max(.09,.28-air/800)+")";
 ctx.beginPath();ctx.ellipse(worldX(heroX),worldY(GROUND+groundOffset+2),42*scale*shadowScale,7*scale*shadowScale,0,0,Math.PI*2);ctx.fill();
 heroSprite();
 if(ahead)birdSprite();
 drawObstacleNearRims();
};
function nextBlocked(oldX,target){
 if(target<=oldX)return target;
 if(solved&&bridgeProgress<1&&oldX<=RAVINE_LEFT-55&&target>RAVINE_LEFT-55){hitMessage="Köprü onarılıyor…";hitTimer=clock+1.2;return RAVINE_LEFT-55;}
 for(const g of GATES){
  if(!SOLVED.has(g.id)&&oldX<=g.stop&&target>g.stop){hitMessage="🔎 "+g.label+" · büyütece dokun";hitTimer=clock+1.5;return g.stop}
 }
 return target;
}
function nextHazard(oldX,target){
 if(Math.abs(target-oldX)<.05)return target;
 for(const h of HAZARDS){
  const geom=obstacleGeometry(h),footRadius=12;
  const start=geom.left-footRadius,end=geom.right+footRadius;
  const clearance=geom.clearance;
  if(target>oldX&&target>start&&target<end&&heroY>GROUND-clearance){
   hitMessage=h.type==="gap"?"Boşluğun üzerinden zıpla ↑":"Üzerinden atlamak için zıpla ↑";hitTimer=clock+1.7;flashObstacle=clock+.25;return start-2;
  }
  if(target<oldX&&target<end&&target>start&&heroY>GROUND-clearance){
   hitMessage="Engeli geçmek için zıpla ↑";hitTimer=clock+1.7;return end+2;
  }
 }
 return target;
}
update=function(dt){
 if(!started||modalOpen)return;
 if(heroY<GROUND||vy!==0){vy+=1280*dt;heroY=Math.min(GROUND,heroY+vy*dt);if(heroY>=GROUND){heroY=GROUND;vy=0}}
 const previous=heroX;
 // Ground run stays unchanged. In the air, directional travel matches the
 // approximately 252 + 170 units/sec from Dedenin Evi's directional jump.
 // Releasing the direction still stops horizontal input without changing jump height.
 const horizontalSpeed=heroY<GROUND-.2?422:245;
 let target=Math.max(280,Math.min(GATE_X+32,heroX+requested*horizontalSpeed*dt));
 target=nextBlocked(heroX,target);
 target=nextHazard(heroX,target);
 heroX=target;
 if(Math.abs(heroX-previous)>.01){face=requested>=0?1:-1;travel+=Math.abs(heroX-previous)}
 if(solved&&bridgeProgress<1)bridgeProgress=Math.min(1,(clock-bridgeBuildStart)/2.1);
 saveTimer+=dt;if(saveTimer>2&&Math.abs(heroX-saveLastX)>32)save();
 const active=available(),gate=nearestGate(),done=campaignProgress();
 $("#examine").hidden=!active;
 let hint=active==="FINISH"?"🔎 Gözlemevinin kapısını aç":gate?"🔎 "+(gate.index+1)+"/21: "+gate.label+" · İNCELE tuşuna dokun":"Sağa ilerle. Küçük boşluklar, taşlar ve kütükler için ZIPLA ↑";
 if(hitTimer>clock)hint=hitMessage;
 $("#hint").hidden=!(hitTimer>clock||active);$("#hint").textContent=hint;
 $("#progress").textContent=done+"/21 mühür açıldı · "+(done===21?"Gözlemevine ilerle":(GATES.find(g=>!SOLVED.has(g.id))?.label||"Yol açık"));
 $("#campaignHud").textContent="🌿 "+done+"/21 engel · "+difficulty.toUpperCase();
 $("#progressFill").style.width=(100*done/21)+"%";
 $(".hud-v75 .trackShell").setAttribute("aria-valuenow",String(done));
 $("#progress").textContent=done+"/21 engel · "+difficulty.toUpperCase();
 if(!finishShown&&done===21&&heroX>=GATE_X-80){finishShown=true;reachGate()}
};
if(new URLSearchParams(location.search).get("preview")==="1")approved=true;
if(!approved){
 openModal("Önce Dedenin Evi","<p>Bu bölüm, Dedenin Evi'ndeki üç halka keşfinden sonra açılır. Kontrol amaçlı önizleme için bağlantıya <b>?preview=1</b> ekleyebilirsiniz.</p>");
 action("Dedenin Evine Dön",()=>location.assign("./?scene=home"));
}else if(resumed){
 started=true;introDone=true;save(true);$("#hint").textContent="Kaldığın yerden devam ediyorsun.";
}else{started=false;story();}

requestAnimationFrame(loop);
</script>
