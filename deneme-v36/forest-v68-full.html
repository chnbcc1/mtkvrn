<script>
'use strict';
const SAVE_KEY='mathverse-v40-investigation';
const W=13040,H=941,GROUND=728,RAVINE_LEFT=4658,RAVINE_RIGHT=4873,BRIDGE_X=4593,GATE_X=12580;
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d',{alpha:false});
const $=s=>document.querySelector(s);
const erdem=new Image(),chiko=new Image(),forestPhoto=new Image();
forestPhoto.src=window.FOREST_HD_V67||'./forest-v66-hd.svg?v=66';
if(window.ERDEM_V57_HD_ATLAS)erdem.src=window.ERDEM_V57_HD_ATLAS;
if(window.CHIKO_V57_HD_ATLAS)chiko.src=window.CHIKO_V57_HD_ATLAS;
let backing={},approved=false,solved=false,reachedGate=false,resumed=false,bridgeProgress=0,bridgeBuildStart=0,difficulty='orta',heroX=360,heroY=GROUND,vy=0,travel=0,face=1,requested=0,activePointers=new Map(),camera=0,camReady=false,scale=1,vw=innerWidth,vh=innerHeight,dpr=1,last=0,clock=0,flyingX=365,flyingY=420,flyingFace=1,modalOpen=false,started=false,saveLastX=360,saveTimer=0,nearMarker=null,seenMarker=false;
try{
 backing=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')||{};
 approved=Boolean(backing.complete&&backing.visitedStudy);
 const stage=backing.chapter2||{};
 resumed=stage.stage==='forest-path';
 solved=Boolean(stage.puzzleSolved);
 bridgeProgress=solved?1:0;
 reachedGate=Boolean(stage.reachedGate);
 difficulty=['kolay','orta','zor'].includes(stage.difficulty)?stage.difficulty:'orta';
 heroX=Math.min(solved?GATE_X+10:BRIDGE_X,Math.max(310,Number(stage.x)||360));
 if(new URLSearchParams(location.search).get('focus')==='gate'&&reachedGate)heroX=GATE_X-105;
}catch(e){backing={};approved=false;}
const QUESTIONS={
 kolay:{
  text:'Kırık köprünün açıklığını kapatmak için x metre uzunluğunda iki eş tahta ve 1 metrelik sabit destek kullanılacak. Toplam uzunluk 6 metre olduğuna göre bir tahta kaç metre olmalı?',
  relation:'2x + 1 = 6',options:['2 metre','2,5 metre','3 metre','3,5 metre'],correct:1,
  hint:'İki tahtanın toplamı 6 − 1 = 5 metredir. 2x = 5 eşitliğini çöz.',
  why:'2x + 1 = 6 ⇒ 2x = 5 ⇒ x = 2,5 metre.'
 },
 orta:{
  text:'Köprüye x metre uzunluğunda üç eş tahta ve toplam 0,6 metrelik sabit destek yerleştirilecek. Geçiş 7,8 metre olmalı. Her tahta kaç metre uzunluğunda olmalı?',
  relation:'3x + 0,6 = 7,8',options:['2,2 metre','2,4 metre','2,6 metre','3 metre'],correct:1,
  hint:'Önce 7,8 − 0,6 işlemini yap. Kalan uzunluk üç eş tahtaya bölünüyor.',
  why:'3x + 0,6 = 7,8 ⇒ 3x = 7,2 ⇒ x = 2,4 metre.'
 },
 zor:{
  text:'Her tahta 1,5 metre güvenli geçiş sağlar. Başlangıç platformu 0,8 metredir. En az 6,5 metrelik güvenli yol için kaç tam tahta gerekir?',
  relation:'1,5n + 0,8 ≥ 6,5',options:['3 tahta','4 tahta','5 tahta','6 tahta'],correct:1,
  hint:'1,5n ≥ 5,7. Her iki tarafı 1,5’e böl, sonucu tam tahta sayısına yuvarla.',
  why:'1,5n + 0,8 ≥ 6,5 ⇒ n ≥ 3,8. En az 4 tam tahta gerekir.'
 }
};
function save(force=false){
 if(!approved)return;
 if(!force&&Math.abs(saveLastX-heroX)<35&&saveTimer<2)return;
 saveLastX=heroX;saveTimer=0;
 try{
  const latest=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')||{};
  latest.chapter2EntrySeen=true;
  latest.activeScene='forest-path';
  latest.chapter2={...(latest.chapter2||{}),stage:'forest-path',x:Math.round(heroX),difficulty,puzzleSolved:solved,reachedGate};
  localStorage.setItem(SAVE_KEY,JSON.stringify(latest));
 }catch(e){}
}
function resize(){vw=innerWidth;vh=innerHeight;dpr=Math.min(devicePixelRatio||1,3);scale=Math.max(vh/H,vw/1450);canvas.width=Math.round(vw*dpr);canvas.height=Math.round(vh*dpr);canvas.style.width=vw+'px';canvas.style.height=vh+'px';camReady=false}
addEventListener('resize',resize);resize();
function openModal(title,content,eyebrow='BÖLÜM 2'){modalOpen=true;requested=0;activePointers.clear();updatePress();$('#modalTitle').textContent=title;$('#modalContent').innerHTML=content;$('#eyebrow').textContent=eyebrow;$('#modalActions').replaceChildren();$('#feedback').textContent='';$('#modal').hidden=false}
function closeModal(){modalOpen=false;$('#modal').hidden=true;$('#modalActions').replaceChildren();$('#feedback').textContent='';last=0}
function action(label,fn,variant='primary'){const b=document.createElement('button');b.type='button';b.className=variant;b.textContent=label;b.onclick=fn;$('#modalActions').appendChild(b);return b}
function story(){
 openModal('Orman Patikası','<p>Erdem haritayı çantasına yerleştirdi. Çiko, tepeye uzanan patikanın üzerinde uçuyordu.</p><div class="thought">💭 <b>Erdem:</b> “Eski gözlemevine giden yol bu olmalı.”</div><p>Yürüyerek ilerle, gerekirse zıpla. Yol üzerinde karşılaşacağın sorunu ölçerek çöz.</p>');
 action('Patikaya çık ▶',()=>{started=true;closeModal();save(true)});
}
function home(){save(true);location.assign('./map-v62.html?from=forest')}
function journal(){
 const title=reachedGate?'Gözlemevi kapısı':solved?'Köprü tamamlandı':'Orman patikası';
 const note=reachedGate?'Erdem ve Çiko gözlemevinin girişine ulaştı.':solved?'Köprüyü ölçerek geçebilecekleri uzunluğu buldular.':'Erdem ve Çiko dere üzerindeki köprüyü incelemeye gidiyor.';
 openModal('Erdem’in yol notları','<p><strong>'+title+'</strong></p><p>'+note+'</p><p>Köprü görevi: '+(solved?'Tamamlandı':'Henüz çözülmedi')+'</p>');
 action('Yola dön',closeModal);
 action('🗺️ Macera haritasına bak',home,'secondary');
 if(reachedGate)action('Gözlemevi kapısını incele',()=>{closeModal();reachGate()},'secondary');
}
function puzzle(showChoice=true){
 if(solved){openModal('Köprü hazır','<p>Ölçüler tamamlandı. Erdem ve Çiko dereyi güvenle geçebilir.</p>');action('Yola devam et',closeModal);return}
 const question=QUESTIONS[difficulty];
 openModal('Kırık köprü','<p>Tahtalar kırıldığı için dereden geçilemiyor. Eksik parçalar yerine konmadan yol açılmayacak.</p><div class="thought">💭 <b>Erdem:</b> “Önce doğrusal denklemle ölçüyü bulmalıyım.”</div><p class="footerNote">9. sınıf · MAT.9.2.3 · Doğrusal denklem ve eşitsizlikler</p>');
 const area=$('#modalContent');
 const tabs=document.createElement('div');tabs.className='actions';tabs.style.gridTemplateColumns='repeat(3,1fr)';
 for(const [id,label] of [['kolay','Kolay'],['orta','Orta'],['zor','Zor']]){
  const b=document.createElement('button');b.className=id===difficulty?'primary':'secondary';b.textContent=label;b.style.minHeight='43px';b.style.padding='7px';b.onclick=()=>{difficulty=id;save(true);puzzle(false)};tabs.appendChild(b);
 }
 area.appendChild(tabs);
 const statement=document.createElement('div');statement.className='statement';statement.style.marginTop='15px';statement.textContent=question.text;area.appendChild(statement);
 const model=document.createElement('div');model.className='statement';model.style.marginTop='9px';model.style.textAlign='center';model.style.fontSize='22px';model.style.letterSpacing='.4px';model.textContent=question.relation;area.appendChild(model);
 const answers=document.createElement('div');answers.className='actions';area.appendChild(answers);
 question.options.forEach((choice,i)=>{
  const b=document.createElement('button');b.className='answer';b.textContent=choice;
  b.onclick=()=>{
   if(i!==question.correct){$('#feedback').textContent='Henüz değil. Denklemi veya eşitsizliği yeniden kontrol et.';return}
   solved=true;bridgeProgress=0;bridgeBuildStart=clock;save(true);
   area.innerHTML='<p><strong>Doğru!</strong> '+question.why+'</p><p>Erdem doğru ilişkiyi kurdu. Çiko, eksik tahtaların yerleşmesine yardım etti. Köprü birkaç saniye içinde tamamlanacak.</p><div class="thought">💭 <b>Erdem:</b> “Şimdi yolumuza devam edebiliriz.”</div>';
   $('#modalTitle').textContent='Köprü tamamlandı';$('#feedback').textContent='';
   $('#modalActions').replaceChildren();action('Karşıya geç ▶',closeModal);
  };
  answers.appendChild(b);
 });
 action('Kısa ipucu göster',()=>{$('#feedback').textContent=question.hint},'secondary');
 action('Patikaya dön',closeModal,'secondary');
}
function reachGate(){
 if(!reachedGate){reachedGate=true;save(true)}
 openModal('Gözlemevi Kapısı','<p>Patika bitti. Erdem ve Çiko yüksek taş duvarların ardındaki eski gözlemevinin girişine ulaştı.</p><div class="thought">💭 <b>Erdem:</b> “Haritada gördüğüm üç halka burada da var.”</div><p>Giriş kapısındaki işaret incelenmeyi bekliyor.</p>');
 action('Gözlemevini dışarıdan incele',()=>{
  $('#modalTitle').textContent='Üç halka işareti';
  $('#modalContent').innerHTML='<p>Taş kapının üzerine yan yana üç halka oyulmuş. İşaretin altında soluk bir ölçü çizgisi var.</p><div class="thought">💭 <b>Erdem:</b> “Bu çizgiler bir ölçüyü gösteriyor olabilir.”</div>';
  $('#modalActions').replaceChildren();action('Patikaya dön',closeModal);
 },'secondary');
 action('Patikaya dön',closeModal);
}
function updatePress(){for(const [id,dir] of [['left',-1],['right',1]])$('#'+id).classList.toggle('pressed',requested===dir)}
function hold(dir,on,id){
 if(on)activePointers.set(id,dir);else activePointers.delete(id);
 requested=0;for(const v of activePointers.values())requested+=v;
 requested=Math.max(-1,Math.min(1,requested));updatePress();
}
for(const [id,dir] of [['left',-1],['right',1]]){
 const btn=$('#'+id);
 btn.addEventListener('contextmenu',e=>e.preventDefault());
 btn.addEventListener('pointerdown',e=>{e.preventDefault();if(modalOpen||!started)return;btn.setPointerCapture(e.pointerId);hold(dir,true,e.pointerId)});
 for(const type of ['pointerup','pointercancel','lostpointercapture'])btn.addEventListener(type,e=>hold(dir,false,e.pointerId));
}
function jump(){if(!started||modalOpen||heroY<GROUND-.2)return;vy=-590}
$('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
$('#home').onclick=home;$('#journal').onclick=journal;
addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp',' ','e','E','a','d','A','D'].includes(e.key))e.preventDefault();
 if(e.key==='Escape'&&modalOpen){closeModal();return}
 if(!started||modalOpen)return;
 if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')hold(-1,true,'keyLeft');
 if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')hold(1,true,'keyRight');
 if((e.key==='ArrowUp'||e.key===' ')&&!e.repeat)jump();
 if(e.key.toLowerCase()==='e')interact();
});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')hold(-1,false,'keyLeft');if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')hold(1,false,'keyRight')});
addEventListener('blur',()=>{requested=0;activePointers.clear();updatePress()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){requested=0;activePointers.clear();updatePress();save(true)}last=0});
function available(){if(modalOpen||!started||heroY<GROUND-50)return null;if(!solved&&Math.abs(heroX-1560)<175)return 'bridge';if(Math.abs(heroX-3000)<155)return 'gate';return null}
function interact(){if(available()==='bridge')puzzle();else if(available()==='gate')reachGate()}
let down=null;
canvas.addEventListener('pointerdown',e=>{down={id:e.pointerId,x:e.clientX,y:e.clientY}});
canvas.addEventListener('pointercancel',()=>{down=null});
canvas.addEventListener('pointerup',e=>{
 if(!down||down.id!==e.pointerId||Math.hypot(down.x-e.clientX,down.y-e.clientY)>25){down=null;return}
 down=null;const m=available();if(!m)return;
 const mp=campaignMarker(m);const x=mp.x,y=mp.y;
 const sx=(x-camera)*scale,sy=y*scale+offsetY();
 const px=e.clientX-canvas.getBoundingClientRect().left,py=e.clientY-canvas.getBoundingClientRect().top;
 if(Math.hypot(sx-px,sy-py)<64){e.preventDefault();interact()}
});
function offsetY(){return Math.max(-6,(vh-H*scale)/2)}
function worldX(x){return(x-camera)*scale}
function worldY(y){return y*scale+offsetY()}
function tree(x,base,rad,foreground=false){
 const xx=worldX(x),yy=worldY(base),k=scale;
 if(xx<-220||xx>vw+220)return;
 ctx.save();
 if(foreground){ctx.globalAlpha=.75}
 const trunk=ctx.createLinearGradient(xx-rad*k,0,xx+rad*k,0);
 trunk.addColorStop(0,'#3a2d21');trunk.addColorStop(.55,'#75583b');trunk.addColorStop(1,'#2b3324');
 ctx.fillStyle=trunk;ctx.beginPath();ctx.moveTo(xx-rad*.14*k,yy);ctx.quadraticCurveTo(xx-rad*.1*k,yy-145*k,xx-rad*.23*k,yy-240*k);ctx.lineTo(xx+rad*.06*k,yy-240*k);ctx.lineTo(xx+rad*.23*k,yy);ctx.closePath();ctx.fill();
 for(let row=0;row<3;row++){
  const y=yy-(150+row*80)*k,rr=(rad*(1.1-row*.18))*k;
  const cg=ctx.createRadialGradient(xx-rr*.3,y-rr*.4,rr*.12,xx,y,rr);
  cg.addColorStop(0,foreground?'#477f45':'#78a95a');

 worldObject(g.x,GROUND,()=>{

const baseBackground=background;
background=function(){baseBackground();
 for(const h of HAZARDS)drawMini(h);
 drawBridgeDetailed();
 for(const g of GATES)drawMain(g);
};
render=function(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
 const maxCam=Math.max(0,W-vw/scale),desired=Math.max(0,Math.min(maxCam,heroX-vw/scale*.43));
 if(!camReady){camera=desired;camReady=true}else camera+=(desired-camera)*.13;
 background();
 const a=available();if(a){const mp=campaignMarker(a);marker(mp.x,mp.y)}
 const ahead=Math.cos(clock*.9)>0;
 if(!ahead)birdSprite();
 const air=Math.max(0,GROUND-heroY),shadowScale=Math.max(.65,1-air/420);
 ctx.fillStyle="rgba(12,35,25,"+Math.max(.09,.28-air/800)+")";
 ctx.beginPath();ctx.ellipse(worldX(heroX),worldY(GROUND+groundOffset+2),42*scale*shadowScale,7*scale*shadowScale,0,0,Math.PI*2);ctx.fill();
 heroSprite();
 if(ahead)birdSprite();
};
function nextBlocked(oldX,target){
 if(target<=oldX)return target;
 if(solved&&bridgeProgress<1&&oldX<=RAVINE_LEFT-55&&target>RAVINE_LEFT-55){hitMessage="Köprü onarılıyor…";hitTimer=clock+1.2;return RAVINE_LEFT-55;}
 for(const g of GATES){
  if(!SOLVED.has(g.id)&&oldX<=g.stop&&target>g.stop){hitMessage="🔎 "+g.label+" · büyütece dokun";hitTimer=clock+1.5;return g.stop}
 }
 return target;
}
function nextHazard(oldX,target){
 if(Math.abs(target-oldX)<.05)return target;
 for(const h of HAZARDS){
  const start=h.x-27,end=h.x+h.w+24;
  if(target>oldX&&target>start&&target<end&&heroY>GROUND-h.height-18){
   hitMessage=h.type==="gap"?"Küçük boşluk! Zıpla ↑":"Önünde engel var! Zıpla ↑";hitTimer=clock+1.7;flashObstacle=clock+.25;return start-2;
  }
  if(target<oldX&&target<end&&target>start&&heroY>GROUND-h.height-18){
   hitMessage="Geri geçmek için zıpla ↑";hitTimer=clock+1.7;return end+2;
  }
 }
 return target;
}
update=function(dt){
 if(!started||modalOpen)return;
 if(heroY<GROUND||vy!==0){vy+=1150*dt;heroY=Math.min(GROUND,heroY+vy*dt);if(heroY>=GROUND){heroY=GROUND;vy=0}}
 const previous=heroX;
 let target=Math.max(280,Math.min(GATE_X+32,heroX+requested*245*dt));
 target=nextBlocked(heroX,target);
 target=nextHazard(heroX,target);
 heroX=target;
 if(Math.abs(heroX-previous)>.01){face=requested>=0?1:-1;travel+=Math.abs(heroX-previous)}
 if(solved&&bridgeProgress<1)bridgeProgress=Math.min(1,(clock-bridgeBuildStart)/2.1);
 saveTimer+=dt;if(saveTimer>2&&Math.abs(heroX-saveLastX)>32)save();
 const active=available(),gate=nearestGate(),done=campaignProgress();
 $("#examine").hidden=!active;
 let hint=active==="FINISH"?"🔎 Gözlemevinin kapısını aç":gate?"🔎 "+(gate.index+1)+"/21: "+gate.label+" · İNCELE tuşuna dokun":"Sağa ilerle. Küçük boşluklar, taşlar ve kütükler için ZIPLA ↑";
 if(hitTimer>clock)hint=hitMessage;
 $("#hint").hidden=false;$("#hint").textContent=hint;
 $("#progress").textContent=done+"/21 mühür açıldı · "+(done===21?"Gözlemevine ilerle":(GATES.find(g=>!SOLVED.has(g.id))?.label||"Yol açık"));
 $("#campaignHud").textContent="🌿 "+done+"/21 engel · "+difficulty.toUpperCase();
 if(!finishShown&&done===21&&heroX>=12510){finishShown=true;reachGate()}
};
if(new URLSearchParams(location.search).get("preview")==="1")approved=true;
if(!approved){
 openModal("Önce Dedenin Evi","<p>Bu bölüm, Dedenin Evi'ndeki üç halka keşfinden sonra açılır. Kontrol amaçlı önizleme için bağlantıya <b>?preview=1</b> ekleyebilirsiniz.</p>");
 action("Dedenin Evine Dön",()=>location.assign("./?scene=home"));
}else if(resumed){
 started=true;introDone=true;save(true);$("#hint").textContent="Kaldığın yerden devam ediyorsun.";
}else{started=false;story();}

requestAnimationFrame(loop);
