<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Matematik Evreni · Sahne Kontrolü v243</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#112d27;color:#fff4d5;font:15px system-ui,sans-serif}body{min-height:100dvh;padding:12px}main{max-width:1000px;margin:auto;display:grid;gap:10px}h1{font-size:21px;margin:0}p{margin:0;line-height:1.4}label{display:grid;gap:5px;font-weight:650}select,button,a.open{font:inherit;min-height:44px;border:1px solid #ba975a;border-radius:8px;padding:8px;background:#fff3d4;color:#193a2e}button,a.open{font-weight:700;text-align:center;cursor:pointer;text-decoration:none}.fields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}iframe{border:1px solid #ba975a;border-radius:10px;width:100%;height:65dvh;min-height:260px;background:#102d27}.status{padding:8px;border:1px solid #ba975a;border-radius:8px;overflow-wrap:anywhere}.sub{font-size:13px;color:#e0d7b8}@media(max-width:480px){.fields{grid-template-columns:1fr 1fr}.fields label:first-child{grid-column:1/-1}}
/* v227: same iframe remains mounted; the return toolbar is outside the game. */
.qa-return[hidden]{display:none!important}
body.qa-full{padding:0;overflow:hidden}
body.qa-full main{position:fixed;inset:0;max-width:none;width:100%;height:100%;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:0;padding:0;overflow:hidden}
body.qa-full main > :not(.qa-return):not(iframe){display:none!important}
body.qa-full .qa-return{display:flex;align-items:center;gap:8px;padding:max(4px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 4px max(8px,env(safe-area-inset-left));background:#112d27;border-bottom:1px solid #ba975a;min-width:0}
.qa-return button{flex:0 0 auto;min-height:44px;padding:6px 12px}
.qa-return span{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.qa-full iframe{height:100%;min-height:0;width:100%;border:0;border-radius:0;display:block}
/* v228: compact single-row toolbar, including narrow phone widths. */
body.qa-full .qa-return{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:4px}
.qa-return button{font-size:clamp(11px,3.5vw,14px);padding:5px 7px;white-space:nowrap}
.qa-return button:disabled{opacity:.42;cursor:default}
.qa-return #fullQuestion{text-align:center;font-weight:700;font-size:clamp(11px,3.4vw,14px)}
</style></head><body><main><h1>Sahne kontrolü · v243</h1><p class="sub">21 görev · 630 soru. Deneme ekranı oyun ilerlemesini, soru geçmişini ve kayıtlı defter notlarını değiştirmez. Tam ekran açarak telefonu döndürebilirsin. Geri dönünce seçimin ve açık soru korunur.</p><div class="fields"><label>Görev<select id="task"></select></label><label>Zorluk<select id="level"><option value="kolay">Kolay</option><option value="orta">Orta</option><option value="zor">Zor</option></select></label><label>Soru<select id="question"></select></label></div><div class="actions"><button id="reload" type="button">Yeniden aç</button><button id="full" type="button" disabled>Tam ekran aç</button></div><div id="status" class="status" role="status" aria-live="polite">Soru bankası yükleniyor…</div><div id="returnBar" class="qa-return" hidden><button id="backToQA" type="button" aria-label="Sahne kontrolüne dön">‹ Kontrol</button><button id="prevQuestion" type="button" disabled>‹ Önceki</button><span id="fullQuestion" aria-live="polite"></span><button id="nextQuestion" type="button" disabled>Sonraki ›</button></div><iframe id="frame" title="Gerçek oyun soru ekranı"></iframe></main>
<script>
"use strict";
const el=id=>document.getElementById(id);
let bank=null,timer=0,currentId="";
let fullMode=false,controlScroll=0;
function setFullMode(on){
 if(on===fullMode||on&&!currentId)return;
 if(on)controlScroll=window.scrollY||0;
 fullMode=on;document.body.classList.toggle("qa-full",on);el("returnBar").hidden=!on;
 syncNavigation();
 if(on)el("backToQA").focus({preventScroll:true});else{window.scrollTo(0,controlScroll);el("full").focus({preventScroll:true})}
}
el("full").onclick=()=>setFullMode(true);el("backToQA").onclick=()=>setFullMode(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&fullMode)setFullMode(false)});
function option(select,value,label){const o=document.createElement("option");o.value=value;o.textContent=label;select.append(o)}
function populateQuestions(){const q=el("question");q.replaceChildren();for(const [i,item] of bank.questions.filter(x=>x.obstacleId===el("task").value&&x.difficulty===el("level").value).entries())option(q,item.id,(i+1)+". soru");}
function questionGroup(){return bank?.questions.filter(x=>x.obstacleId===el("task").value&&x.difficulty===el("level").value)||[]}
function syncNavigation(){
 const group=questionGroup(),index=group.findIndex(x=>x.id===currentId);
 el("fullQuestion").textContent=index>=0?currentId+" · "+(index+1)+"/"+group.length:"";
 el("prevQuestion").disabled=index<=0;
 el("nextQuestion").disabled=index<0||index>=group.length-1;
}
function moveQuestion(delta){
 const group=questionGroup(),index=group.findIndex(x=>x.id===currentId),next=index+delta;
 if(index<0||![-1,1].includes(delta)||next<0||next>=group.length)return false;
 el("question").value=group[next].id;openQuestion();return true;
}
el("prevQuestion").onclick=()=>moveQuestion(-1);
el("nextQuestion").onclick=()=>moveQuestion(1);
function openQuestion(){if(!bank)return;currentId=el("question").value;syncNavigation();const url=new URL("forest-v70-quiz.html",location.href);for(const [k,v] of Object.entries({v:"243",embedded:"1",preview:"1",obstacle:el("task").value,difficulty:el("level").value,previewQuestion:currentId}))url.searchParams.set(k,v);el("full").disabled=false;el("status").textContent="Sahne yükleniyor…";el("frame").src=url.href;const selected=new URL(location.href);selected.searchParams.set("task",el("task").value);selected.searchParams.set("level",el("level").value);selected.searchParams.set("question",currentId);try{history.replaceState(null,"",selected.href)}catch(e){}clearTimeout(timer);timer=setTimeout(()=>el("status").textContent="Sahne doğrulama bildirimi alınamadı. Ekranı kontrol et; gerekirse yeniden aç.",8000)}
window.addEventListener("message",e=>{if(e.origin!==location.origin||e.source!==el("frame").contentWindow||e.data?.source!=="mtk-qa-v225")return;const d=e.data;if(d.obstacle&&d.obstacle!==el("task").value)return;clearTimeout(timer);if(d.event==="return-to-trail"){setFullMode(false);return;}if(d.event==="scene-ready")el("status").textContent=d.question+" · Yeni sahne açıldı · "+(d.orientation==="landscape"?"Yatay":"Dikey")+" · Karakter: "+(d.characterLoaded?d.characterWidth+" × "+d.characterHeight:"yüklenmedi")+" · Veri etiketi: "+d.labels;else if(d.event==="fallback")el("status").textContent="Eski ekrana dönüş: "+d.reason;else if(d.event==="solved-preview")el("status").textContent="Engel açma denemesi başarılı; gerçek oyun kaydına yazılmadı.";else if(d.event==="error")el("status").textContent="Hata: "+d.message;});
el("task").onchange=el("level").onchange=()=>{populateQuestions();openQuestion()};el("question").onchange=openQuestion;el("reload").onclick=openQuestion;
(async()=>{try{const r=await fetch("./forest-questions-v147.json?v=212");if(!r.ok)throw Error("Soru bankası alınamadı");bank=await r.json();if(bank.questions.length!==630||bank.playOrder.length!==21)throw Error("Banka doğrulanamadı");for(const id of bank.playOrder){const item=bank.obstacles.find(x=>x.id===id);option(el("task"),id,id+" · "+item.title)}const params=new URLSearchParams(location.search),task=params.get("task"),level=params.get("level"),question=params.get("question");if(bank.playOrder.includes(task))el("task").value=task;if(["kolay","orta","zor"].includes(level))el("level").value=level;populateQuestions();if(bank.questions.some(x=>x.id===question&&x.obstacleId===el("task").value&&x.difficulty===el("level").value))el("question").value=question;openQuestion()}catch(e){el("status").textContent=e.message;bank=null}})();
</script></body></html>
