<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Matematik Evreni · Sahne Kontrolü v225</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#112d27;color:#fff4d5;font:15px system-ui,sans-serif}body{min-height:100dvh;padding:12px}main{max-width:1000px;margin:auto;display:grid;gap:10px}h1{font-size:21px;margin:0}p{margin:0;line-height:1.4}label{display:grid;gap:5px;font-weight:650}select,button,a.open{font:inherit;min-height:44px;border:1px solid #ba975a;border-radius:8px;padding:8px;background:#fff3d4;color:#193a2e}button,a.open{font-weight:700;text-align:center;cursor:pointer;text-decoration:none}.fields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}iframe{border:1px solid #ba975a;border-radius:10px;width:100%;height:65dvh;min-height:260px;background:#102d27}.status{padding:8px;border:1px solid #ba975a;border-radius:8px;overflow-wrap:anywhere}.sub{font-size:13px;color:#e0d7b8}@media(max-width:480px){.fields{grid-template-columns:1fr 1fr}.fields label:first-child{grid-column:1/-1}}
</style></head><body><main><h1>Sahne kontrolü · v225</h1><p class="sub">21 görev · 630 soru. Deneme ekranı oyun ilerlemesini, soru geçmişini ve kayıtlı defter notlarını değiştirmez. Tam ekran açarak telefonu döndürebilirsin.</p><div class="fields"><label>Görev<select id="task"></select></label><label>Zorluk<select id="level"><option value="kolay">Kolay</option><option value="orta">Orta</option><option value="zor">Zor</option></select></label><label>Soru<select id="question"></select></label></div><div class="actions"><button id="reload" type="button">Yeniden aç</button><a id="full" class="open" target="_blank" rel="noopener">Tam ekran aç</a></div><div id="status" class="status" role="status" aria-live="polite">Soru bankası yükleniyor…</div><iframe id="frame" title="Gerçek oyun soru ekranı"></iframe></main>
<script>
"use strict";
const el=id=>document.getElementById(id);
let bank=null,timer=0,currentId="";
function option(select,value,label){const o=document.createElement("option");o.value=value;o.textContent=label;select.append(o)}
function populateQuestions(){const q=el("question");q.replaceChildren();for(const [i,item] of bank.questions.filter(x=>x.obstacleId===el("task").value&&x.difficulty===el("level").value).entries())option(q,item.id,(i+1)+". soru");}
function openQuestion(){if(!bank)return;currentId=el("question").value;const url=new URL("forest-v70-quiz.html",location.href);for(const [k,v] of Object.entries({v:"225",embedded:"1",preview:"1",obstacle:el("task").value,difficulty:el("level").value,previewQuestion:currentId}))url.searchParams.set(k,v);el("full").href=url.href;el("status").textContent="Sahne yükleniyor…";el("frame").src=url.href;clearTimeout(timer);timer=setTimeout(()=>el("status").textContent="Sahne doğrulama bildirimi alınamadı. Ekranı kontrol et; gerekirse yeniden aç.",8000)}
window.addEventListener("message",e=>{if(e.origin!==location.origin||e.source!==el("frame").contentWindow||e.data?.source!=="mtk-qa-v225")return;const d=e.data;if(d.obstacle&&d.obstacle!==el("task").value)return;clearTimeout(timer);if(d.event==="scene-ready")el("status").textContent=d.question+" · Yeni sahne açıldı · "+(d.orientation==="landscape"?"Yatay":"Dikey")+" · Karakter: "+(d.characterLoaded?d.characterWidth+" × "+d.characterHeight:"yüklenmedi")+" · Veri etiketi: "+d.labels;else if(d.event==="fallback")el("status").textContent="Eski ekrana dönüş: "+d.reason;else if(d.event==="solved-preview")el("status").textContent="Engel açma denemesi başarılı; gerçek oyun kaydına yazılmadı.";else if(d.event==="error")el("status").textContent="Hata: "+d.message;});
el("task").onchange=el("level").onchange=()=>{populateQuestions();openQuestion()};el("question").onchange=openQuestion;el("reload").onclick=openQuestion;
(async()=>{try{const r=await fetch("./forest-questions-v147.json?v=212");if(!r.ok)throw Error("Soru bankası alınamadı");bank=await r.json();if(bank.questions.length!==630||bank.playOrder.length!==21)throw Error("Banka doğrulanamadı");for(const id of bank.playOrder){const item=bank.obstacles.find(x=>x.id===id);option(el("task"),id,id+" · "+item.title)}populateQuestions();openQuestion()}catch(e){el("status").textContent=e.message;bank=null}})();
</script></body></html>
