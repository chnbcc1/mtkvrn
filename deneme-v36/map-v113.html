<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#123932">
<title>v135 · Matematik Evreni Macera Haritası</title>
<link rel="stylesheet" href="./assets/game-ui-v127.css?v=127">
<link rel="stylesheet" href="./assets/unified-ui-v133.css?v=139">
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#081d24;font-family:system-ui,sans-serif}
.mtk-map-layer{position:fixed;inset:0}
</style>
</head>
<body>
<!-- Compatibility view for direct bookmarks only. In-game play uses the SAME
     atlas DOM inside MTKGameUI.openMap, without leaving the chapter. -->
<div class="mtk-map-layer">
 <section class="mtk-map-sheet" role="dialog" aria-label="Macera haritası">
  <div class="mtk-map-sheet-head">
   <strong>🧭 MACERA HARİTASI</strong>
   <button id="back" class="mtk-map-sheet-close" type="button">✕ Dön</button>
  </div>
  <div class="mtk-map-contents" id="map"></div>
 </section>
</div>
<script src="./assets/world-map-v133.js?v=139"></script><script src="./assets/map-world-registry-v133.js?v=139"></script>
<script>
"use strict";
const from=new URLSearchParams(location.search).get("from")||"home";
function backToSource(){
 const url=from==="menu"?"./menu-v116.html?v=139":
  from==="forest"?"./forest-v113-full.html?resume=1&v=164":
  from==="title"?"./menu-v116.html?v=139":"./?scene=home&autostart=1&v=139";
 location.assign(url);
}
document.getElementById("back").addEventListener("click",backToSource);
const fallbackForest="./forest-v113-full.html?resume=1&v=164";
window.MTKWorldMap.mount(document.getElementById("map"),{
 from,
 onClose:backToSource,
 onNavigate:region=>{
  const entry=window.MTKWorldMap.chapters().find(ch=>ch.id===region);
  if(entry?.route)location.assign(entry.route);
 }
});
</script>
</body>
</html>
