<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07192f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Matematik Evreni – Profesörün Kayıp İzleri · v132</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07192f;color:#fff3d5;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
body{display:grid;place-items:center;min-height:100vh;min-height:100dvh}
#frame{width:min(100vw,177.6833dvh);aspect-ratio:1672/941;position:relative;overflow:hidden;filter:drop-shadow(0 0 35px #0006)}
#frame img{width:100%;height:100%;object-fit:fill;display:block;user-select:none;-webkit-user-drag:none}
.hit{position:absolute;cursor:pointer;border:0;border-radius:30px;background:transparent;color:transparent;font-size:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.hit:focus-visible{outline:3px solid #fff;outline-offset:-4px;background:#fff2}
.hit:hover{background:#fff1}
#start{left:51.6%;top:40%;width:29%;height:11.2%}
#resume{left:54.4%;top:52.5%;width:24.5%;height:9.4%}
#chapters{left:54.3%;top:62.8%;width:24.5%;height:9.4%}
#settings{left:54.3%;top:73.2%;width:24.5%;height:9.4%}
@media(orientation:portrait){
 #frame{width:min(100vw,56.28dvh);aspect-ratio:941/1672}
 #start{left:17%;top:65.3%;width:65%;height:7%}
 #resume{left:17.5%;top:73%;width:64%;height:7.0%}
 #chapters{left:17.5%;top:80.7%;width:64%;height:6.9%}
 #settings{left:17.4%;top:88.4%;width:64%;height:6.6%}
}
#shade[hidden]{display:none}#shade{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:calc(15px + env(safe-area-inset-top)) 14px calc(15px + env(safe-area-inset-bottom));background:#061427bf;backdrop-filter:blur(12px)}
.dialog{width:min(100%,520px);max-height:100%;overflow:auto;border:2px solid #e7b56c;border-radius:24px;padding:clamp(16px,4vw,28px);background:linear-gradient(155deg,#143c58,#102338 73%);box-shadow:0 16px 80px #000b,inset 0 1px 0 #ffffff40}
.dialog h2{margin:0 0 14px;color:#ffe2a3;font-size:clamp(24px,5vw,32px)}.dialog p{line-height:1.45;color:#e9f3f2;margin:8px 0 16px}.dialog footer{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:20px}
.dialog button,.chapter{border:1px solid #d0a15b;border-radius:12px;background:linear-gradient(180deg,#365675,#183a51);padding:12px 16px;color:#fff4df;font:inherit;font-weight:750;cursor:pointer;min-height:46px}
.dialog button.primary{background:linear-gradient(180deg,#edc47e,#a65d21);color:#271c0d}.dialog button:disabled{opacity:.48;cursor:not-allowed}.dialog button:focus-visible{outline:3px solid #fff}
.setting{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:12px 0;padding:13px 15px;border-radius:15px;background:#ffffff12;border:1px solid #ffffff24}
.setting strong{display:block}.setting small{display:block;color:#cbdce4;margin-top:3px;font-size:12px}.setting input{width:24px;height:24px;accent-color:#dba350;cursor:pointer;flex-shrink:0}
.chapter-list{display:grid;gap:10px}.chapter{display:flex;text-align:left;flex-direction:column;gap:3px;width:100%}.chapter small{font-weight:450;color:#e5d8b8}.chapter:disabled small{color:#b1b1b1}
.info{font-size:13px;border-top:1px solid #ffffff30;padding-top:14px;margin-top:16px}.status{font-size:13px;color:#f6d68c;margin-top:13px}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="./assets/game-ui-v127.css?v=132"><link rel="stylesheet" href="./assets/unified-ui-v132.css?v=132">
<style>
/* All main-menu cards fit the screen instead of using a long scrolling web panel. */
#shade{overflow:hidden;padding:max(7px,env(safe-area-inset-top)) 9px max(7px,env(safe-area-inset-bottom))}
#shade .dialog.mtk-ui-dialog{
 width:min(690px,100%);height:min(540px,calc(100dvh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));
 max-height:none;min-height:0;overflow:hidden;display:grid;
 grid-template-rows:auto minmax(0,1fr) auto;gap:8px;
 padding:clamp(10px,2vh,18px);
}
#shade .dialog #panelBody{min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6px;overflow:hidden}
#shade .dialog #panelActions{min-height:0;display:flex;gap:9px;margin:0;justify-content:center;align-items:center}
#shade .dialog #panelActions button{flex:1;min-width:0;padding:8px 10px;min-height:39px;font-size:clamp(12px,2vh,15px)}
#shade .dialog .chapter-list{min-height:0;display:grid;grid-template-columns:1fr;gap:5px}
#shade .dialog .chapter{padding:8px 11px}
#shade .dialog .chapter small{font-size:11px}
#shade .dialog .info{min-height:0;margin:0;padding:6px}
#shade .dialog .info h3{margin:2px 0;font-size:15px}
#shade .dialog .info p{font-size:11px;line-height:1.25}
@media(orientation:landscape) and (max-height:480px){
 #shade .dialog.mtk-ui-dialog{padding:8px 14px;gap:3px}
 #shade .dialog #panelTitle{font-size:clamp(19px,5.7vh,25px);margin:0}
 #shade .dialog #panelBody>p{font-size:11px;margin:0}
 #shade .dialog .chapter-list{grid-template-columns:repeat(3,minmax(0,1fr))}
 #shade .dialog .chapter{min-width:0;padding:5px}
 #shade .dialog .chapter strong{font-size:11px}
 #shade .dialog .chapter small{font-size:9px;line-height:1.1}
 #shade .dialog .mtk-setting-list{grid-template-columns:1fr 1fr;gap:7px}
 #shade .dialog .mtk-setting-list label{min-width:0;min-height:45px!important}
 #shade .dialog .mtk-setting-label small{display:none}
 #shade .dialog .info p:last-child{display:none}
}
</style>

<style>
/* v126: short confirmation cards grow with content instead of filling the phone. */
#shade .dialog.mtk-ui-dialog[data-size="confirmation"]{
 box-sizing:border-box;height:auto!important;min-height:0!important;
 max-height:min(340px,calc(100dvh - 26px - env(safe-area-inset-top) - env(safe-area-inset-bottom)))!important;
 width:min(550px,calc(100vw - 24px))!important;
 display:flex!important;flex-direction:column;justify-content:center;
 gap:clamp(10px,2vh,17px)!important;padding:clamp(16px,3vh,25px)!important;
}
#shade .dialog[data-size="confirmation"] h2{
 font-size:clamp(23px,4.1vw,31px)!important;line-height:1.08!important;margin:0!important
}
#shade .dialog[data-size="confirmation"] #panelBody{
 display:block!important;flex:0 0 auto!important;overflow:visible!important;
 padding:0!important;min-height:0!important
}
#shade .dialog[data-size="confirmation"] #panelBody p{margin:0!important;font-size:clamp(13px,2.1vw,17px)!important}
#shade .dialog[data-size="confirmation"] #panelActions{display:flex;gap:9px}
#shade .dialog[data-size="confirmation"] #panelActions button{
 min-height:42px;font-size:clamp(12px,2.1vw,15px);white-space:normal
}
@media(orientation:landscape) and (max-height:460px){
 #shade .dialog.mtk-ui-dialog[data-size="confirmation"]{gap:7px!important;padding:10px 15px!important;max-height:calc(100dvh - 12px)!important}
 #shade .dialog[data-size="confirmation"] h2{font-size:clamp(19px,4vh,25px)!important}
}
</style>
</head>
<body>
<main id="frame" aria-label="Matematik Evreni – Profesörün Kayıp İzleri ana ekranı">
<picture><source media="(orientation: portrait)" srcset="./assets/menu-v116-portrait.avif"><img src="./assets/menu-v116-landscape.avif" alt="Matematik Evreni: Profesörün Kayıp İzleri, Erdem ve Çiko'nun matematik macerası; menü seçenekleri" draggable="false" fetchpriority="high"></picture>
<button class="hit" id="start" aria-label="Yeni Oyun">Yeni Oyun</button>
<button class="hit" id="resume" aria-label="Devam Et">Devam Et</button>
<button class="hit" id="chapters" aria-label="Bölümler">Bölümler</button>
<button class="hit" id="settings" aria-label="Ayarlar">Ayarlar</button>
</main>
<div id="shade" hidden><section class="dialog mtk-ui-dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="panelTitle"><h2 id="panelTitle"></h2><div id="panelBody"></div><footer id="panelActions"></footer></section></div>
<script src="./settings-v116.js?v=116"></script><script src="./assets/world-map-v132.js?v=132"></script><script src="./assets/game-ui-v131.js?v=132"></script>
<script>
'use strict';
const SAVE_KEY='mathverse-v40-investigation', FOREST_KEY='mathverse-v68-forest-full';
const $=s=>document.querySelector(s), read=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')||{}}catch(e){return {}}};
const homeUrl='./?scene=home&autostart=1&v=132',forestUrl='./forest-v113-full.html?resume=1&v=132';
const home=()=>read(SAVE_KEY), forest=()=>read(FOREST_KEY);
function hasSave(){const h=home(),f=forest();return !!(h.introSeen||h.visitedStudy||h.complete||(Array.isArray(h.found)&&h.found.length)||f.token||(Array.isArray(f.solvedIds)&&f.solvedIds.length));}
function hasForest(){const h=home();return !!(h.complete&&h.visitedStudy);}
function closePanel(){const shade=$('#shade');shade.hidden=true;delete $('#dialog').dataset.size;$('#panelBody').replaceChildren();$('#panelActions').replaceChildren();}
function openPanel(title,markup,actions=[]){$('#dialog').dataset.size=title==='Yeni oyun başlatılsın mı?'?'confirmation':'';$('#panelTitle').textContent=title;$('#panelBody').innerHTML=markup;const footer=$('#panelActions');footer.replaceChildren();for(const [caption,handler,primary] of actions){const b=document.createElement('button');b.textContent=caption;b.type='button';b.className=primary?'primary':'';b.addEventListener('click',handler);footer.append(b)}$('#shade').hidden=false;const focus=footer.querySelector('button');focus?.focus();}
function newGame(){if(hasSave()){openPanel('Yeni oyun başlatılsın mı?','<p>Mevcut macera kaydın silinecek ve Erdem ile Çiko başlangıçtan başlayacak. Ayarlar korunacaktır.</p>',[['Vazgeç',closePanel],['Yeni Oyuna Başla',resetAndStart,true]]);}else resetAndStart();}
function resetAndStart(){try{localStorage.removeItem(SAVE_KEY);localStorage.removeItem(FOREST_KEY);localStorage.removeItem('mathverse-v128-chapter-milestones')}catch(e){}location.assign(homeUrl);}
function resumeGame(){if(!hasSave()){openPanel('Kayıt bulunamadı','<p>Henüz kayıtlı bir macera yok. Önce Yeni Oyun ile başlayabilirsin.</p>',[['Tamam',closePanel]]);return;}
const h=home(),f=forest();const forestStarted=hasForest()&&(h.activeScene==='forest-path'||f.token||h.chapter2?.stage==='forest-path');location.assign(forestStarted?forestUrl:homeUrl);}
function showChapters(){
 const stages=window.MTKWorldMap.progress().chapters;
 const markup='<p>Her bölüm bir önceki tamamlanınca açılır. Yeni maceralar sisin ardında bekliyor.</p><div class="chapter-list">'+
  stages.map((c,i)=>'<button class="chapter" data-chapter-id="'+c.id+'" '+(!c.unlocked||!c.playable?'disabled':'')+'><strong>'+
   c.icon+' '+(i+1)+'. '+(c.unlocked?c.name:'Bilinmeyen Bölge')+'</strong><small>'+
   (!c.unlocked?'🔒 Sis altında':!c.playable?'Yakında':c.complete?'✓ Tamamlandı · Yeniden oyna':'Açıldı · Devam et')+'</small></button>').join('')+
  '</div>';
 openPanel('Bölümler',markup,[['Kapat',closePanel]]);
 $('#panelBody').querySelectorAll('[data-chapter-id]').forEach(button=>button.addEventListener('click',()=>{
  const c=stages.find(x=>x.id===button.dataset.chapterId);
  if(!c?.unlocked||!c.playable||!c.route)return;
  closePanel();location.assign(c.route);
 }));
}
function showSettings(){
 const p=window.MTKPrefs.load();
 openPanel('⚙️ Oyun Ayarları',window.MTKGameUI.settingsMarkup('menu',p)+
  '<div class="info"><h3>ℹ️ Profesörün Kayıp İzleri</h3><p>TÜBİTAK 4006 · Erdem ve Çiko ile matematik macerası. İlerleme bu tarayıcıda saklanır.</p></div>',
  [['Kapat',closePanel]]);
 window.MTKGameUI.bindSettings('menu');
}
$('#start').addEventListener('click',newGame);$('#resume').addEventListener('click',resumeGame);$('#chapters').addEventListener('click',showChapters);$('#settings').addEventListener('click',showSettings);
$('#shade').addEventListener('click',e=>{if(e.target===$('#shade'))closePanel()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#shade').hidden)closePanel()});
</script>
</body>
</html>
